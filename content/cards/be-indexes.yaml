summary: Indexes speed some reads and tax all inserts, updates and deletes.
  Composite indexes work left to right, which is why column order is not
  cosmetic.
detail:
  - An index is a second data structure the database must keep in sync. Every
    insert updates the table and every index on it, so ten indexes mean roughly
    ten times the write amplification. Unused indexes are pure cost.
  - Composite indexes are usable left to right, like a phone book sorted by last
    name then first. An index on (tenant_id, created_at) serves queries
    filtering on tenant_id alone, or on both — but not queries filtering only on
    created_at.
  - Selectivity decides whether an index is worth it. Indexing a boolean that is
    true for 90% of rows rarely helps, because the planner correctly decides a
    sequential scan is cheaper. Read your query plans; the planner will tell you
    what it actually used.
