summary: Shards split data by key. Celebrity users and popular tenants create
  hot partitions, and timestamp keys funnel every write into one place.
detail:
  - Sharding buys capacity by splitting data across independent nodes. It only
    works if access spreads evenly, and real-world access almost never does. One
    enterprise tenant or one viral account can saturate a single shard while the
    rest idle.
  - Timestamp-prefixed keys are the classic mistake. Because writes always carry
    the current time, every insert lands on the newest partition and you have
    built a distributed system with a single hot writer. Hashing or prefixing
    with a high-cardinality field fixes it.
  - Resharding later is genuinely hard, which is why the key deserves real
    thought up front. Consistent hashing reduces how much data moves when you
    add nodes, and composite keys that lead with a well-distributed field give
    you room to query without scanning everything.
