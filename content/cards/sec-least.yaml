summary: Assume every credential eventually leaks, then ask what it could do.
  Narrow scopes and short lifetimes turn a breach into an inconvenience.
detail:
  - Least privilege is not about distrusting colleagues, it is about accepting
    that compromise is a matter of when. The useful question for any credential
    is what an attacker holding it could reach, and the useful answer is "very
    little".
  - In practice that means resource-scoped policies rather than wildcards,
    separate read and write roles, and per-service identities instead of one
    shared admin key. A reporting job that can only read one table cannot be
    used to drop your database.
  - Short-lived credentials matter as much as narrow ones. Assumed roles and
    workload identity federation issue credentials that expire in minutes, so a
    leaked value is usually already worthless. Long-lived static keys in CI are
    the single most common thing worth eliminating.
