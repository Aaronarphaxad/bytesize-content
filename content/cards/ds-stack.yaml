summary: Last in, first out. Undo history, expression parsing and your own call
  frames are all the same structure wearing different names.
detail:
  - A stack only allows push and pop at one end, and that single constraint is
    what makes it useful. Order is preserved exactly in reverse, which is
    precisely what undo, backtracking and nested-scope resolution need.
  - Your language runtime maintains one for you. Each function call pushes a
    frame holding parameters and locals; returning pops it. Infinite recursion
    is just this stack outgrowing its allocation, which is why the error is
    called stack overflow.
  - That equivalence is a practical refactoring tool. Any recursive algorithm
    can be rewritten iteratively with an explicit stack, which is how you
    process a tree a million nodes deep without the runtime killing you.
