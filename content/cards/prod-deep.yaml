summary: Rebuilding a mental model of complex code takes real minutes. Six
  interruptions an afternoon can cost you the entire afternoon.
detail:
  - Hard engineering work requires holding a large model in working memory —
    call paths, invariants, the three edge cases you just discovered. An
    interruption evicts that model, and reloading it is slow and partial.
  - That is why fragmented time is not equivalent to the same minutes in a
    block. Six scattered half-hours do not produce what one uninterrupted
    three-hour block does, because much of each fragment goes to reconstruction
    rather than progress.
  - Protect blocks structurally rather than heroically. Put focus time on the
    calendar, batch code review and messages into defined windows, and agree
    team norms about what genuinely warrants an immediate ping. Culture beats
    willpower here.
