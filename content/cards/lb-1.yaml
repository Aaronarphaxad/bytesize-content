summary: One stable address in front of many disposable backends. That single
  indirection is what makes horizontal scale, rolling deploys and failover
  possible.
detail:
  - A load balancer gives clients one endpoint to remember while the fleet
    behind it changes constantly. Instances come and go, deploy, crash and
    autoscale, and none of that churn reaches the client.
  - The health check is the part that actually earns its keep. The balancer
    probes each backend on an interval and stops routing to anything that fails,
    which converts a server crash from an outage into a brief dip in capacity.
  - That indirection is also what makes safe deploys possible. Drain connections
    from one instance, replace it, let it pass health checks, then move to the
    next. Users never see a restart because there is always a healthy pool to
    answer them.
