title: Roll back first, debug afterwards
topic: devops
kind: diagram
difficulty: intermediate
tags: []
readMinutes: 1
status: published
source:
  label: Google SRE Workbook · Canarying Releases
  url: https://sre.google/workbook/canarying-releases/
reviewed: 2026-10-06
summary: Ship to a canary, watch the signals, and if users are hurting revert
  immediately. Diagnosis is cheaper once nobody is bleeding.
detail:
  - Progressive delivery means a new build sees a small slice of traffic first.
    You compare error rate and latency between canary and baseline, and only
    widen the rollout once the comparison is boring.
  - The instinct to fix forward under pressure is usually wrong. A rollback is a
    known-good state reachable in a minute; a hotfix is unverified code written
    by a stressed person. Restore service, then investigate with logs and a
    clear head.
  - This only works if rollback is genuinely rehearsed. Keep the previous
    artefact ready to serve, make migrations backward-compatible so the old code
    still runs against the new schema, and practise the procedure before you
    need it at 3am.
