summary: An ADR captures context, alternatives and consequences. Without it
  teams re-litigate the same debate annually with worse information.
detail:
  - "An architecture decision record is short by design: the context, the
    options considered, the choice, and the consequences accepted. It takes
    fifteen minutes and saves the same argument being had from scratch in
    eighteen months."
  - The rejected alternatives are the most valuable part. Knowing you evaluated
    and dismissed an approach — and precisely why — stops someone confidently
    proposing it again, and tells you when the reasoning has expired because a
    constraint changed.
  - Keep them in the repository next to the code, numbered and immutable.
    Superseding a decision means writing a new record that links to the old one,
    which gives you a readable history of how the system came to be shaped the
    way it is.
