summary: The provider handles patching, backups and failover. Schema design,
  query cost and application-level resilience stay firmly yours.
detail:
  - "A managed database removes genuinely thankless work: OS patching,
    replication setup, backup verification, automated failover. For most teams
    that is excellent value, because none of it differentiates your product."
  - What does not transfer is everything above the infrastructure. A managed
    database will happily run your unindexed query across fifty million rows and
    bill you for it. Failover still drops in-flight connections, so your
    application needs retry logic and connection pooling regardless.
  - The real tradeoffs are control and exit cost. You get the provider's
    version, maintenance windows and extension list, and deep use of proprietary
    features makes leaving expensive. Pay that price deliberately where the
    leverage is real, not by default everywhere.
