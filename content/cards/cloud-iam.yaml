summary: A principal assumes a role and receives temporary scoped credentials.
  Nothing secret is stored, so nothing secret can leak from config.
detail:
  - Role assumption inverts the usual model. Instead of handing a service a
    permanent key, you let it prove its identity and receive credentials that
    expire in an hour. There is no secret in your config to accidentally commit
    or forget to rotate.
  - "The permissions come from the role's policy, and the trust policy controls
    who may assume it. Both halves matter: a generous permission policy with a
    sloppy trust policy is how one compromised workload ends up with database
    admin."
  - This pattern now extends outside the cloud provider. OIDC federation lets a
    GitHub Actions workflow assume a role directly, which removes the single
    most commonly leaked credential in modern software — the static cloud key
    sitting in CI secrets.
