source:
  label: RFC 6749 · OAuth 2.0
  url: https://datatracker.ietf.org/doc/html/rfc6749
reviewed: 2026-10-06
summary: Anyone holding the token can read every claim inside it — base64 is not
  encryption. And you cannot revoke a stateless token before it expires.
detail:
  - Signing proves a token was issued by you and has not been altered. It does
    nothing to hide the contents. Paste any JWT into a decoder and the payload
    is right there, which means user roles, emails and internal ids are all
    readable by whoever holds it.
  - The harder problem is revocation. A stateless token is valid until it
    expires because verification never touches your database. Someone who steals
    it keeps access for the full lifetime, and a user clicking "log out
    everywhere" does not actually stop it.
  - The standard compromise is short-lived access tokens — minutes, not days —
    paired with a long-lived refresh token you do store and can revoke. Refresh
    token rotation with reuse detection then turns a stolen refresh token into a
    detectable event rather than silent persistent access.
