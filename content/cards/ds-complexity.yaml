summary: Asymptotics decide what survives at scale, but constants decide what is
  fast today. A linear scan of a small array beats a hash map more often than
  you think.
detail:
  - The ladder from O(1) through O(log n), O(n), O(n log n) to O(n squared)
    tells you how cost grows as input grows. At a million items the difference
    between the ends of that ladder is the difference between milliseconds and
    days.
  - Big-O deliberately discards constants, which is why it can mislead at small
    n. A linear scan over 20 contiguous array elements is often faster than a
    hash lookup, because the array fits in cache and the hash has to compute,
    index and chase a pointer.
  - Use both lenses. Pick the right asymptotic class so you do not fall off a
    cliff as data grows, then measure real workloads to catch the cases where
    memory locality matters more than the exponent.
