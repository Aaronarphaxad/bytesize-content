summary: Reviewers reliably find bugs in 200 lines and reliably rubber-stamp
  2000. Review quality falls off a cliff long before attention does.
detail:
  - Review effectiveness collapses with size. A focused diff gets line-by-line
    attention; a huge one gets skimmed and approved because nobody can hold it
    all in their head. The large PR that felt efficient to write is where
    defects actually land.
  - Small PRs also move faster through the whole system. They are easier to
    schedule into a gap between meetings, they conflict less, and they are far
    easier to revert cleanly when something goes wrong in production.
  - Make them easy to accept. Separate refactors from behaviour changes so
    reviewers are not diffing both at once, explain the why rather than the what
    in the description, and say how you verified it. Stacked PRs let you ship a
    large change as a readable sequence.
