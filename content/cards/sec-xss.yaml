summary: Injected script inherits your cookies, your session and your DOM.
  Escaping depends entirely on where the value lands.
detail:
  - Cross-site scripting means attacker-controlled script executing on your
    origin, with full access to the session. From there it can exfiltrate
    tokens, rewrite the page, or quietly submit authenticated requests as the
    user.
  - "There is no single escape function, because the rules differ by context.
    The same string needs different treatment inside HTML text, an attribute, a
    URL, a style block or a script block. Escaping for HTML and then injecting
    into an href is still exploitable via javascript: URLs."
  - Defend in layers. Let your framework do contextual escaping and never reach
    for dangerouslySetInnerHTML without sanitising through something like
    DOMPurify. Then add a Content-Security-Policy so that even a successful
    injection has no permitted script source to run from.
