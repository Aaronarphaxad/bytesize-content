summary: Synchronous work fails under bursts. A queue lets producers and
  consumers scale independently, retry with backoff, and shed load without
  dropping users.
detail:
  - When traffic spikes, synchronous architectures convert load into latency and
    then into errors. Every request holds a thread while it waits, the pool
    exhausts, and failures spread to endpoints that had nothing to do with the
    spike.
  - A queue decouples accepting work from doing work. The API writes a message
    and returns quickly; workers drain the backlog at whatever rate they can
    sustain. The spike becomes a temporarily deeper queue instead of an outage.
  - "What you take on is operational: queue depth becomes a metric you alert on,
    messages can be delivered more than once so handlers must be idempotent, and
    you need a dead-letter queue so poison messages do not block the line
    forever."
